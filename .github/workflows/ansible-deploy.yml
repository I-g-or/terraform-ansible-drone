name: Run Ansible via SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ansible:
    name: Ansible over SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.general --force

      - name: Install AWS Session Manager Plugin
        run: |
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o session-manager-plugin.deb
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version
        
      - name: Check SSM managed instances
        run: |
          echo "=== Looking for drone-server in SSM ==="
          aws ssm describe-instance-information \
            --filters "Key=tag:Name,Values=drone-server" \
            --query "InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus,Platform:PlatformName}" \
            --output table || true

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ANSIBLE_CONFIG: ansible_config.cfg
        run: |
          ansible-playbook playbooks/site.yml -i inventory/aws_ec2.yml -v