---
- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/node_exporter
    create_home: false
    state: present

- name: Create temporary directory for download
  ansible.builtin.tempfile:
    state: directory
    suffix: node_exporter
  register: node_exporter_tmp
  changed_when: false

- name: Download node_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    dest: "{{ node_exporter_tmp.path }}/node_exporter.tar.gz"
    mode: "0644"
  register: node_exporter_download

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: "{{ node_exporter_tmp.path }}/node_exporter.tar.gz"
    dest: "{{ node_exporter_tmp.path }}"
    remote_src: true
    creates: "{{ node_exporter_tmp.path }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_tmp.path }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_bin_path }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart node_exporter

- name: Deploy systemd unit file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Remove temporary files
  ansible.builtin.file:
    path: "{{ node_exporter_tmp.path }}"
    state: absent
  changed_when: false

- name: Wait for node_exporter to become ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    status_code: 200
  register: node_exporter_check
  until: node_exporter_check.status == 200
  retries: 10
  delay: 5
  changed_when: false