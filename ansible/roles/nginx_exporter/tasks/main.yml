---
- name: Create nginx_exporter system group
  ansible.builtin.group:
    name: "{{ nginx_exporter_group }}"
    system: true
    state: present

- name: Create nginx_exporter system user
  ansible.builtin.user:
    name: "{{ nginx_exporter_user }}"
    group: "{{ nginx_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/nginx_exporter
    create_home: false
    state: present

- name: Create temporary directory for download
  ansible.builtin.tempfile:
    state: directory
    suffix: nginx_exporter
  register: nginx_exporter_tmp
  changed_when: false

- name: Download nginx_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/nginxinc/nginx-prometheus-exporter/releases/download/v{{ nginx_exporter_version }}/nginx-prometheus-exporter_{{ nginx_exporter_version }}_{{ nginx_exporter_arch }}.tar.gz"
    dest: "{{ nginx_exporter_tmp.path }}/nginx_exporter.tar.gz"
    mode: "0644"

- name: Extract nginx_exporter binary
  ansible.builtin.unarchive:
    src: "{{ nginx_exporter_tmp.path }}/nginx_exporter.tar.gz"
    dest: "{{ nginx_exporter_tmp.path }}"
    remote_src: true
    creates: "{{ nginx_exporter_tmp.path }}/nginx-prometheus-exporter"

- name: Install nginx_exporter binary
  ansible.builtin.copy:
    src: "{{ nginx_exporter_tmp.path }}/nginx-prometheus-exporter"
    dest: "{{ nginx_exporter_bin_path }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart nginx_exporter

- name: Deploy systemd unit file
  ansible.builtin.template:
    src: nginx_exporter.service.j2
    dest: /etc/systemd/system/nginx_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx_exporter

- name: Enable and start nginx_exporter service
  ansible.builtin.systemd:
    name: nginx_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Remove temporary files
  ansible.builtin.file:
    path: "{{ nginx_exporter_tmp.path }}"
    state: absent
  changed_when: false

- name: Wait for nginx_exporter to become ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_exporter_port }}/metrics"
    status_code: 200
  register: nginx_exporter_check
  until: nginx_exporter_check.status == 200
  retries: 10
  delay: 5
  changed_when: false
  