---
- name: Create Drone directory
  ansible.builtin.file:
    path: "{{ drone_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Drone data directory
  ansible.builtin.file:
    path: "{{ drone_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy docker-compose.yml for Drone
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ drone_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Drone with docker compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ drone_dir }}"
  register: drone_compose_result
  changed_when: "'Started' in drone_compose_result.stderr or 'Creating' in drone_compose_result.stderr or 'Recreating' in drone_compose_result.stderr"
