[default]
host_key_checking = False
inventory = ./inventory/aws_ssm.yml
interpreter_python = auto_silent
timeout = 60

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml, amazon.aws.aws_ec2