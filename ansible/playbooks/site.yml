---
# === Drone Server ===
- name: Configure drone server (Docker + Nginx + Let's Encrypt)
  hosts: tag_Name_drone_server
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common]

    - role: docker
      tags: [docker]

    - role: nginx
      tags: [nginx]

    - role: certbot
      tags: [certbot]

    - role: drone
      tags: [drone]

    - role: node_exporter
      tags: [node_exporter]

    - role: nginx_exporter
      tags: [nginx_exporter]    

# === Monitoring Server ===
- name: Configure monitoring server
  hosts: tag_Name_monitoring
  become: true
  gather_facts: true

  roles:
    - role: monitoring 
